		<style>

:root {
	--component-bgc: #222;
	--button-bgc: #69C;
	--button-hover-bgc: #369;
	--button-focus-bgc: #036;
	--success-bgc: #0F0;
	--success-hover-bgc: #0C0;
	--success-focus-bgc: #090;
	--transp: rgba(0,0,0,0);
	--darker: rgba(0,0,0,0.6);
	background: #000;
}
* {
	background: var(--transp);
	/* outline: 1px solid red !important; */
	border: none;
	box-sizing: border-box;
	color: #FFF;
	font-family: Hack, Consolas, monospace;
	margin: 0;
	outline: none;
	padding: 0;
	text-align: center;
	text-align-last: center;
	text-shadow: 1px 1px 1px var(--darker), -1px -1px 1px var(--darker), -1px 1px 1px  var(--darker), 1px -1px 1px var(--darker);
}
p,h1,h2,h3,h4,h5,h6,ul,li {text-align: left; text-align-last: left;}
body {
	min-height: 100vh;
	padding: 1em;
}
body *:not(div):not(img):not(sup):not(form) {
	border-radius: 8px;
	margin: 0.25em;
	padding: 0.25em;
}
button {
	cursor: pointer;
	font-weight: 700;
	font-size: 1em;
	background: var(--button-bgc);
}
button:hover {
	/* transition: 0.5s; */
	background: var(--button-hover-bgc);
}
button:active {
	outline: 1px solid var(--button-bgc);
	background: var(--button-focus-bgc);
}
button:disabled {background: var(--transp);}
button:disabled span:after {
	animation-name: genFXa;
	animation-duration: 1.5s;
	animation-fill-mode: forwards;
	animation-iteration-count: infinite;
	font-weight: 100;
	content: attr(x);
}
footer {width: 100%;}
footer {border-top: 1px solid var(--component-bgc);}
footer > * {min-width: 10em;}
img {max-width: 25em; max-height:25em;}
input {
	border-radius: 8px;
	background: var(--component-bgc);
}
input:not(#host) {
	color: skyblue;
	font-weight: lighter;
}
input:focus:not(#host) {
    background: var(--button-focus-bgc);
	transition: 0.5s;
}
.col, .row {
	display: flex;
	align-items: center;
	justify-content: space-around;
}
.col {flex-flow: column wrap;}
.row {flex-flow: row nowrap;}
.done {background: var(--success-bgc);}
.done:hover {background: var(--success-hover-bgc);}
.done:active {
	background: var(--success-focus-bgc);
	outline: 1px solid var(--success-bgc);
}
#main {
	width: 100%;
	max-width: 25em;
	align-items: stretch;
}
#mp, #service, #user, #iter {flex: auto;}
@keyframes genFXa {
	0%   {content: '0101010101';}
	5%   {content: 'G010101010';}
	10%  {content: 'Ge01010101';}
	15%  {content: 'Ge10r01010';}
	20%  {content: 'Ge01ra0101';}
	25%  {content: 'Ge10rat010';}
	30%  {content: 'Gen1rat101';}
	35%  {content: 'Gen0rat01g';}
	40%  {content: 'Generat10g';}
	45%  {content: 'Generat0ng';}
	50%  {content: 'Generating';}
	55%  {content: '0enerating';}
	60%  {content: '10nerating';}
	65%  {content: '01ne0ating';}
	70%  {content: '10ne10ting';}
	75%  {content: '01ne010ing';}
	80%  {content: '101e101ing';}
	85%  {content: '010e010in1';}
	90%  {content: '1010101in0';}
	95%  {content: '0101010i01';}
	100% {content: '1010101010';}
}


/* Algorithm toggle. Sits below the iter input and mirrors the
   extension's badge: outline only, blue for v1, green for v2. */
#algorithm {
	background: var(--transp);
	outline: 1px solid var(--button-bgc);
	color: var(--button-bgc);
	font-weight: 700;
}
#algorithm:hover {
	background: var(--button-hover-bgc);
	color: #FFF;
	outline-color: var(--button-hover-bgc);
}
#algorithm:active {
	background: var(--button-focus-bgc);
	outline-color: var(--button-focus-bgc);
}
#algorithm.v2 {
	outline-color: var(--success-bgc);
	color: var(--success-bgc);
}
#algorithm.v2:hover {
	background: var(--success-hover-bgc);
	color: #000;
	outline-color: var(--success-hover-bgc);
}
#algorithm.v2:active {
	background: var(--success-focus-bgc);
	color: #000;
	outline-color: var(--success-focus-bgc);
}

/* Import button. Secondary action, so it mirrors the #algorithm
   badge treatment (outline only, blue). The generate button keeps
   the solid background as the primary action. */
#import,
#toggle-mp {
	background: var(--transp);
	outline: 1px solid var(--button-bgc);
	color: var(--button-bgc);
	font-weight: 700;
	font-size: 0.9em;
}
#import:hover,
#toggle-mp:hover {
	background: var(--button-hover-bgc);
	color: #FFF;
	outline-color: var(--button-hover-bgc);
}
#import:active,
#toggle-mp:active {
	background: var(--button-focus-bgc);
	outline-color: var(--button-focus-bgc);
}

/* --- Form status, focus, contrast ------------------------------------- */

.hint, .status {
	color: #BBB;
	font-size: 0.85em;
	text-align: center;
	text-align-last: center;
}
.status {min-height: 1.5em;}
.status.error {color: #F88;}

/* White on #69C is 3.0:1 and white on #0F0 is 1.4:1; WCAG AA wants 4.5:1
   for text this size.  Dark text on the light fills, white on the dark ones. */
button {
	color: #000;
	text-shadow: none;
}
button:hover,
button:active,
button:disabled {color: #FFF;}
.done,
.done:hover,
.done:active {color: #000;}

/* The universal rule above removes outlines; keep a keyboard focus ring. */
:focus-visible {
	outline: 2px solid #FFF !important;
	outline-offset: 2px;
}

/* No scrambling text animation for users who ask for less motion. */
@media (prefers-reduced-motion: reduce) {
	button:disabled span:after {
		animation: none;
		content: 'Generating...';
	}
}

</style>

/*
 * Pure derivation logic shared by the main page and the test page.
 *
 * No DOM dependencies and no side effects on load: this file only
 * defines `RpassDerive`. It assumes `scrypt` (from
 * scrypt-async.min.js) is available as a global.
 *
 * The two algorithms and their normalization rules are documented in
 * the Firefox extension's docs/algorithms.md. This file mirrors
 * src/lib/crypto/legacy.ts and src/lib/crypto/v2.ts from that repo.
 */

const RpassDerive = (function () {
	const V1_PARAMS = {
		N: 32768,
		r: 8,
		p: 1,
		dkLen: 50,
		interruptStep: 1000,
		encoding: undefined
	};

	const V2_PARAMS = {
		N: 131072,
		r: 8,
		p: 1,
		dkLen: 32,
		interruptStep: 1000,
		encoding: undefined
	};

	const V2_PREFIX = 'rpass-v2';
	const V2_SEPARATOR = '|';
	const V2_ALPHABET =
		'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+';

	function normalizeIdentifier(input) {
		return String(input).replace(/^\s+|\s+$/g, '').toLowerCase();
	}

	function normalizeIter(input) {
		return String(input).replace(/\D|^0+(?=\d)/g, '');
	}

	function legacySalt(service, user, iter) {
		return (
			normalizeIter(iter) +
			normalizeIdentifier(service) +
			normalizeIdentifier(user)

	}

	function v2Salt(service, user, iter) {
		return [
			V2_PREFIX,
			normalizeIdentifier(service),
			normalizeIdentifier(user),
			normalizeIter(iter)
		].join(V2_SEPARATOR);

	function bytesToLegacyPassword(bytes) {
		let out = '';
		for (let i = 0; i < bytes.length; i++) {
			out += String.fromCharCode((bytes[i] % 95) + 32);
		}
		return out;
	}

	function bytesToV2Password(bytes) {
		let out = '';
		const len = V2_ALPHABET.length;
		for (let i = 0; i < bytes.length; i++) {
			out += V2_ALPHABET[bytes[i] % len];
		}

		if (algorithm === 'v2') {
			scrypt(mp, v2Salt(service, user, iter), V2_PARAMS, function (derivedKey) {
				callback(bytesToV2Password(derivedKey));
			});
		} else {
			scrypt(
				mp,
				legacySalt(service, user, iter),
				V1_PARAMS,
				function (derivedKey) {
					callback(bytesToLegacyPassword(derivedKey));
				}
			);
		}

		derive: derive,
		normalizeIdentifier: normalizeIdentifier,
		normalizeIter: normalizeIter,
		legacySalt: legacySalt,
		v2Salt: v2Salt,

		V2_PARAMS: V2_PARAMS,

'use strict';

/*
 * rpass backup reading.
 *
 * v4 backups are AES-256-GCM ciphertext keyed by a scrypt-derived
 * master key. The key schedule, salt format, HKDF labels and cipher
 * are identical to the Firefox extension's src/lib/crypto/vault-key.ts
 * and are documented in its docs/algorithms.md. This file produces the
 * same plaintext for the same blob and master password.
 *
 * Pre-v4 backups are plaintext JSON; this file just reshapes them.
 *
 * Two shapes are accepted by `load`:
 *   - stored-vault v4:  { _encSalt_, _encIv_, _enc_, _check_ }
 *   - raw EncryptedBlob: { salt, iv, ciphertext, check }
 * The second matches the extension's vault-key.ts test vector; the
 * first is what actually lives on disk in a v4 vault.
 *
 * Requires `scrypt` (from scrypt-async.min.js) to be loaded first.
 * No DOM access, no side effects on load.
 */

const RpassVault = (function () {
	const VAULT_KEY_PREFIX = 'rpass-vault-key';
	const INFO_ENC = 'rpass-vault-enc';
	const INFO_CHECK = 'rpass-vault-check';

	const VAULT_KEY_PARAMS = {
		N: 1 << 17,
		r: 8,
		p: 1,
		dkLen: 32,
		interruptStep: 1000,
		encoding: undefined
	};

	function base64ToBytes(b64) {
		const binary = atob(b64);
		const bytes = new Uint8Array(binary.length);
		for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
		return bytes;
	}

	function bytesToBase64(bytes) {
		let binary = '';
		for (let i = 0; i < bytes.length; i++) {
			binary += String.fromCharCode(bytes[i]);
		}
		return btoa(binary);
	}

	function deriveMasterKey(mp, salt) {
		const saltInput = VAULT_KEY_PREFIX + '|' + bytesToBase64(salt);
		return new Promise(function (resolve) {
			scrypt(mp, saltInput, VAULT_KEY_PARAMS, function (derived) {
				resolve(new Uint8Array(derived));
			});
		});
	}

	async function hkdf(ikm, info) {
		const imported = await crypto.subtle.importKey(
			'raw',
			ikm,
			'HKDF',
			false,
			['deriveBits']
		);
		return crypto.subtle.deriveBits(
			{
				name: 'HKDF',
				hash: 'SHA-256',
				salt: new Uint8Array(0),
				info: new TextEncoder().encode(info)
			},
			imported,
			256
		);
	}

	function equalBytes(a, b) {
		if (a.length !== b.length) return false;
		let diff = 0;
		for (let i = 0; i < a.length; i++) diff |= a[i] ^ b[i];
		return diff === 0;
	}

	/**
	 * Decrypt a raw EncryptedBlob ({ salt, iv, ciphertext, check }).
	 */
	async function decryptBlob(blob, mp) {
		if (!mp) throw new Error('wrong-password');

		const salt = base64ToBytes(blob.salt);
		const iv = base64ToBytes(blob.iv);
		const ciphertext = base64ToBytes(blob.ciphertext);
		const expectedCheck = base64ToBytes(blob.check);

		const master = await deriveMasterKey(mp, salt);
		const encKeyBits = await hkdf(master, INFO_ENC);
		const checkBits = await hkdf(master, INFO_CHECK);

		if (!equalBytes(new Uint8Array(checkBits), expectedCheck)) {
			throw new Error('wrong-password');
		}

		const encKey = await crypto.subtle.importKey(
			'raw',
			encKeyBits,
			'AES-GCM',
			false,
			['decrypt']
		);
		const plaintext = await crypto.subtle.decrypt(
			{ name: 'AES-GCM', iv: iv },
			encKey,
			ciphertext
		);

		const services = {};
		for (const key of Object.keys(stored)) {
			if (key.startsWith('_')) continue;
			services[key] = stored[key];
		}
		return {
			hosts: stored._hosts_ || {},
			algorithms: stored._alg_ || {},
			created: stored._created_ || {},
			lastExport: stored._lastExport_ || null,
			services: services
		};
	}

	function load(stored, mp) {
		if (!stored || typeof stored !== 'object') {
			throw new Error('not a vault object');
		}

		// Stored-vault v4 shape.
		if (
			typeof stored._enc_ === 'string' &&
			typeof stored._encSalt_ === 'string' &&
			typeof stored._encIv_ === 'string' &&
			typeof stored._check_ === 'string'
		) {
			return decryptBlob(
				{
					salt: stored._encSalt_,
					iv: stored._encIv_,
					ciphertext: stored._enc_,
					check: stored._check_
				},
				mp
			);
		}

		// Raw EncryptedBlob shape (used by the golden-vector test).
		if (
			typeof stored.ciphertext === 'string' &&
			typeof stored.salt === 'string' &&
			typeof stored.iv === 'string' &&
			typeof stored.check === 'string'
		) {
			return decryptBlob(stored, mp);
		}

		// Otherwise: pre-v4 plaintext backup.
		return Promise.resolve(readPlaintext(stored));
	}

	return { load: load };

	ui.status.textContent = message;

	return ui.generate.classList.contains('done');

// fires for a click, the Enter key, and keyboard activation of the button.
ui.main.addEventListener('submit', function (e) {
	e.preventDefault();
	if (busy) return;
	if (isDone()) {
		copyPassword();
		return;
	}

	busy = true;
	const startKey = inputKey();
	ui.generate.disabled = true;
	ui.generate.setAttribute('aria-label', 'Generating');
	setLabel('');
	say('Generating\u2026', false, true);

	RpassDerive.derive(
		ui.mp.value,
		ui.service.value,
		ui.user.value,
		ui.iter.value,
		algorithm,
		function (derived) {
			busy = false;
			ui.generate.disabled = false;
			ui.generate.removeAttribute('aria-label');
			if (!document.activeElement || document.activeElement === document.body) {
				ui.generate.focus();
			}
			if (inputKey() !== startKey) {
				setLabel('Generate');
				say('Inputs changed while generating. Press Generate again.', true, true);
				return;
			}
			pw = derived;
			ui.generate.classList.add('done');
			setLabel('Copy to clipboard');
			say('Password ready. Press the button to copy it.', false, true);
		}
	);
});

function copyPassword() {
	clearTimeout(resetTimer);
	copyText(pw)
		.then(
			function () {
				setLabel('Copied!');
				say('Copied to clipboard.', false, true);
			},
			function () {
				setLabel('Copy failed');
				say('Could not write to the clipboard. Check this page\u2019s clipboard permission in your browser.', true, true);
			}
		)
		.then(function () {
			resetTimer = setTimeout(function () {
				if (isDone()) setLabel('Copy to clipboard');
			}, 2000);
		});
}

ui.mp.addEventListener('change', clearDone);
ui.mp.addEventListener('input', clearDone);

ui.service.addEventListener('input', clearDone);
ui.service.addEventListener('change', function () {
	this.value = RpassDerive.normalizeIdentifier(this.value);
	clearDone();
	maybeAutofillFromImport();
});

ui.user.addEventListener('input', clearDone);
ui.user.addEventListener('change', function () {
	this.value = RpassDerive.normalizeIdentifier(this.value);
	clearDone();
	maybeAutofillIter();
});

ui.iter.addEventListener('input', clearDone);
ui.iter.addEventListener('change', function () {
	this.value = RpassDerive.normalizeIter(this.value);
	clearDone();
});

// --- import -------------------------------------------------------------

ui.import.addEventListener('click', function () {
	ui['import-file'].click();
});

ui['import-file'].addEventListener('change', async function (e) {
	const file = e.target.files && e.target.files[0];
	e.target.value = '';
	if (!file) return;

	let stored;
	try {
		const text = (await file.text()).replace(/^\uFEFF/, '');
		stored = JSON.parse(text);
	} catch (err) {
		say('Could not read the backup file: ' + (err && err.message), true);
		return;
	}

	if (
		!stored ||
		typeof stored !== 'object' ||
		(typeof stored._enc_ !== 'string' &&
			(typeof stored._hosts_ !== 'object' ||
				stored._hosts_ === null))
	) {
		say('This is not a valid rpass backup file.', true);
		return;
	}

	if (typeof stored._enc_ === 'string' && !ui.mp.value) {
		say('This backup is encrypted. Enter your master password above, then click Import backup again.', true);
		ui.mp.focus();
		return;
	}

	ui.import.disabled = true;
	say('Decrypting backup\u2026');
	let payload;
	try {
		payload = await RpassVault.load(stored, ui.mp.value);
	} catch (err) {
		if (err && err.message === 'wrong-password') {
			say('Wrong master password for this backup.', true);
			ui.mp.focus();
			ui.mp.select();
		} else {
			say('Could not read the backup: ' + (err && err.message ? err.message : err), true);
			console.error(err);
		}
		return;
	} finally {
		ui.import.disabled = false;
	}

	importedVault = payload;
	populateDatalists(payload);
	say('Backup imported. Service and username suggestions are now available in their fields.');
});

function populateDatalists(vault) {
	const servicesList = document.getElementById('services-list');
	const usersList = document.getElementById('users-list');
	servicesList.innerHTML = '';
	usersList.innerHTML = '';

	const services = Object.keys(vault.services || {}).sort();
	for (const s of services) {
		const opt = document.createElement('option');
		opt.value = s;
		servicesList.appendChild(opt);
	}

	const users = new Set();
	for (const s of services) {
		const record = vault.services[s] || {};
		for (const u of Object.keys(record)) users.add(u);
	}
	for (const u of Array.from(users).sort()) {
		const opt = document.createElement('option');
		opt.value = u;
		usersList.appendChild(opt);
	}
}

function maybeAutofillFromImport() {
	if (!importedVault) return;
	const service = ui.service.value;
	const record = importedVault.services[service];
	if (!record) return;
	const users = Object.keys(record);
	if (users.length === 0) return;
	if (!ui.user.value) ui.user.value = users[0];
	const iter = record[ui.user.value];
	if (iter !== undefined) ui.iter.value = String(iter);
}

function maybeAutofillIter() {
	if (!importedVault) return;
	const record = importedVault.services[ui.service.value];
	if (!record) return;
	const iter = record[ui.user.value];
	if (iter !== undefined) ui.iter.value = String(iter);
}

// --- clipboard ----------------------------------------------------------
//
// navigator.clipboard.writeText needs a secure context and (in some
// browsers) transient user activation; fall back to execCommand('copy').
// Both paths return a promise that reflects whether the copy worked.

function copyText(str) {
	if (navigator.clipboard && navigator.clipboard.writeText) {
		return navigator.clipboard.writeText(str).catch(function () {
			return legacyCopy(str);
		});
	}
	return legacyCopy(str);
}

function legacyCopy(str) {
	/* https://github.com/30-seconds/30-seconds-of-code */
	return new Promise(function (resolve, reject) {
		const el = document.createElement('textarea');
		el.value = str;
		el.setAttribute('readonly', '');
		el.style.position = 'absolute';
		el.style.left = '-9999px';
		document.body.appendChild(el);
		const selected =
			document.getSelection().rangeCount > 0
				? document.getSelection().getRangeAt(0)
				: false;
		el.select();
		let ok = false;
		try {
			ok = document.execCommand('copy');
		} catch (err) {
			ok = false;
		}
		el.value = '';
		document.body.removeChild(el);
		if (selected) {
			document.getSelection().removeAllRanges();
			document.getSelection().addRange(selected);
		}
		if (ok) resolve();
		else reject(new Error('copy command failed'));
	});
}
