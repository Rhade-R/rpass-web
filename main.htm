<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="referrer" content="no-referrer">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
		<link href="assets/ss/main.css" rel="stylesheet">
		<link href="assets/font/Hack/hack.css" rel="stylesheet">
		<script src="assets/js/frame-bust.js" integrity="sha384-sT+O9AG7FUrM5O3jc/rOfdTlu9/v+S8K56WEhW4uIqpkUgGrl+NqfCqyGtPjWt+V" crossorigin="anonymous"></script>
	</head>
	<body class="col">
		<div id="main" class="col">
			<img src="assets/svg/rpass.svg" alt="rpass">
			<input id="mp" type="password" placeholder="master password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" value="" required>
			<input id="service" type="text" placeholder="service name (e.g. github)" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" value="" required list="services-list">
			<datalist id="services-list"></datalist>
			<input id="user" type="text" placeholder="username" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" value="" required list="users-list">
			<datalist id="users-list"></datalist>
			<div class="row">
				<input id="iter" type="text" placeholder="variant" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" value="">
				<button id="algorithm" type="button">v1</button>
			</div>
			<button id="generate" type="button"><span></span></button>
			<div class="row">
				<button id="import" type="button">Import backup</button>
				<input type="file" id="import-file" accept=".json,application/json" hidden>
			</div>
		</div>
		<footer class="row" hidden>
			<a href="./about.htm" cont="About"></a>
			<a id="copyright" href="https://github.com/Rhade-R/rpass-web/raw/main/COPYING.txt" cont="© Rhade"></a>
			<a href="https://github.com/Rhade-R/rpass-web" cont="Github"></a>
		</footer>
		<script src="assets/js/lib/scrypt/scrypt-async.min.js" integrity="sha384-uGfa1nIof7OYj9rJRynq4/uSUO6n137FZOp8z6NoJyxrJMM1fSqy03mp++Og1P08" crossorigin="anonymous"></script>
		<script src="assets/js/derive.js" integrity="sha384-aMxdLkAeHdiQqkO94eZ6oZ9MJFvdieYWj1ZLjV4D92pPG08vvgZ5PVnZS7u7iYm+" crossorigin="anonymous"></script>
		<script src="assets/js/vault.js" integrity="sha384-SRoLXUle8mSTZURbbHVvU4G+9lbpAdhZxGvaHIsm1SNnv1geOtMmpswdAPanmS8H" crossorigin="anonymous"></script>
		<script src="assets/js/main.js" integrity="sha384-5zTtjM4QrfLbvgk1fS2ZqRCiXPwyvB3HT/nuk6v+zc2dfl/3Xhg1bTaQS023K16O" crossorigin="anonymous"></script>
	</body>
</html>
